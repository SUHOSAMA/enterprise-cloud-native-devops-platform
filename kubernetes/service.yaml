apiVersion: v1
kind: Service
metadata:
  name: cloudops-employee-service
  namespace: cloudops
  labels:
    app: cloudops-employee-service
    project: enterprise-cloud-native-devops-platform
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: cloudops-employee-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
