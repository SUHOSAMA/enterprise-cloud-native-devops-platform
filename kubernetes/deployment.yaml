apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-employee-service
  namespace: cloudops
  labels:
    app: cloudops-employee-service
    project: enterprise-cloud-native-devops-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: cloudops-employee-service
  template:
    metadata:
      labels:
        app: cloudops-employee-service
        project: enterprise-cloud-native-devops-platform
    spec:
      containers:
        - name: cloudops-employee-service
          image: 640440228485.dkr.ecr.ap-south-1.amazonaws.com/enterprise-cloud-native-devops-platform:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "5000"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
